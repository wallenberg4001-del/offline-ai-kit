# Offline AI Kit - optional settings for power users (Windows, Mac and Linux).
# Copy this file to "kit-settings.ini" in the same folder and change what you need.
# Lines starting with # are ignored. Delete a line to use the default. See ADVANCED.md.

# Library: essentials or recommended (ignored when ZIMS is set)
#LIBRARY_TIER=recommended

# Exact library list instead of a tier (ids are listed in ADVANCED.md)
#ZIMS=knots,medicine,water,mdwiki,wpmed,ifixit

# Models: a set name (Windows: lite/core/full, Mac: lite/8/16/24/32) or an exact comma list
#MODELS=qwen3.5:9b,llama3.2:3b,medgemma:4b

# Full English Wikipedia (127 GB) background download on first START
#SKIP_WIKIPEDIA=no

# Offline maps chosen in the Setup Wizard (informational). Easy Install leaves this empty.
# Vancouver Island, British Columbia and Alberta share one Canada file.
#MAPS=

# Share on Wi-Fi: 1 = phones/tablets on your HOME Wi-Fi can use the chat and library (never on public Wi-Fi).
# The AI server always stays on 127.0.0.1. Easiest way to change it: the STATUS menu.
#SHARE_ON_WIFI=0

# Ports (only 127.0.0.1 unless SHARE_ON_WIFI=1)
#LIBRARY_PORT=8090
#OLLAMA_PORT=11435
# The little chat page web server (Windows always; Mac only when sharing on Wi-Fi)
#CHAT_PORT=8091

# Use an Ollama you already have instead of the kit's own copy (then OLLAMA_PORT defaults to 11434)
#USE_SYSTEM_OLLAMA=no

# Mac only: force the chip type (normally detected): arm64 (Apple chip) or x86_64 (Intel)
#MAC_ARCH=

# All computers (universal drive). yes = SETUP also downloads the programs for Windows,
# Mac (Apple chip and Intel) and Linux (64-bit PC and ARM). Models, Wikipedia, extra
# libraries and maps stay one shared copy. The wizard shows the extra disk space.
# Leave this unset to set up this computer only. Command line: -Universal or --universal.
#UNIVERSAL=no
